<svg xmlns="http://www.w3.org/2000/svg" width="192" height="84" viewBox="-14 -12 192 84" role="img" aria-label="Résumé">
  <style>.in{opacity:0;transform-box:fill-box;transform-origin:center;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}.in{animation-delay:0.27s}
  .glint{transform:translateX(-120px);animation:glint 1.1s cubic-bezier(.4,0,.2,1) 1.14s forwards}
  @keyframes glint{to{transform:translateX(284px)}}
  @media (prefers-reduced-motion:reduce){.in{animation:fade .2s forwards}@keyframes fade{to{opacity:1}}.glint{animation:none;opacity:0}}</style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.32"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-12%" y="-40%" width="124%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.45"/></filter>
    <clipPath id="cap"><rect width="164" height="48" rx="24"/></clipPath>
  </defs>
  <g class="in">
    <rect width="164" height="48" rx="24" fill="url(#body)" filter="url(#sh)"/>
    <rect x=".5" y=".5" width="163" height="47" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="1.5" y="1.5" width="161" height="45" rx="22.5" fill="none" stroke="url(#rim)"/>
    <g clip-path="url(#cap)"><g transform="skewX(-20)"><rect class="glint" x="0" y="-10" width="70" height="68" fill="url(#sheen)"/></g></g>
    <g transform="translate(41.7 14)"><g fill="none" stroke="#f0f6fc" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2.5h6.5L16 7v10.5H5z"/><path d="M11.5 2.5V7H16M7.8 11h5.4M7.8 14h5.4"/></g></g>
    <text x="70.7" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing=".01em" fill="#f0f6fc">Résumé</text>
  </g>
</svg>
