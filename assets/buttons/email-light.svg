<svg xmlns="http://www.w3.org/2000/svg" width="192" height="84" viewBox="-14 -12 192 84" role="img" aria-label="Email me">
  <style>.in{opacity:0;transform-box:fill-box;transform-origin:center;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}.in{animation-delay:0.33s}
  .glint{transform:translateX(-120px);animation:glint 1.1s cubic-bezier(.4,0,.2,1) 1.26s forwards}
  @keyframes glint{to{transform:translateX(284px)}}
  @media (prefers-reduced-motion:reduce){.in{animation:fade .2s forwards}@keyframes fade{to{opacity:1}}.glint{animation:none;opacity:0}}</style>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="1"/><stop offset="1" stop-color="#f3f4f6" stop-opacity="1"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="sh" x="-12%" y="-40%" width="124%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.1"/></filter>
    <clipPath id="cap"><rect width="164" height="48" rx="24"/></clipPath>
  </defs>
  <g class="in">
    <rect width="164" height="48" rx="24" fill="url(#body)" filter="url(#sh)"/>
    <rect x=".5" y=".5" width="163" height="47" rx="23.5" fill="none" stroke="#1f2328" stroke-opacity="0.12"/>
    <rect x="1.5" y="1.5" width="161" height="45" rx="22.5" fill="none" stroke="url(#rim)"/>
    <g clip-path="url(#cap)"><g transform="skewX(-20)"><rect class="glint" x="0" y="-10" width="70" height="68" fill="url(#sheen)"/></g></g>
    <g transform="translate(33.1 14)"><g fill="none" stroke="#1f2328" stroke-width="1.7" stroke-linejoin="round"><rect x="2.5" y="4.5" width="15" height="11" rx="2.2"/><path d="M3 5.5l7 5.5 7-5.5"/></g></g>
    <text x="62.1" y="30" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing=".01em" fill="#1f2328">Email me</text>
  </g>
</svg>
