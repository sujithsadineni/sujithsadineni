<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="588" height="176" viewBox="0 0 588 176" role="img" aria-label="cashflow: Open source · live. Open-source, local-first finance app with a grounded Claude assistant.">
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif}.in{opacity:0;transform-box:fill-box;transform-origin:center;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out 1s infinite}@keyframes pulse{0%{opacity:.6;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.6)}}@media (prefers-reduced-motion:reduce){.pulse{animation:none;opacity:0}}@media (prefers-reduced-motion:reduce){.in{animation:fade .2s forwards}@keyframes fade{to{opacity:1}}}</style>
  <defs><linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.18"/><stop offset=".4" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <g class="in" style="animation-delay:0.00s"><rect x="0.5" y="0.5" width="587" height="175" rx="22" fill="#161b22" stroke="#30363d"/><rect x="1.5" y="1.5" width="585" height="173" rx="21" fill="none" stroke="url(#edge)"/>
    <svg x="24" y="24" width="64" height="64" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- cashflow's mark: the sidebar logo's four squares (D232) -->
  <rect x="2" y="2" width="13" height="13" rx="3.5" fill="#1F8A57"/>
  <rect x="17" y="2" width="13" height="13" rx="3.5" fill="#F5A524"/>
  <rect x="2" y="17" width="13" height="13" rx="3.5" fill="#3E63DD"/>
  <rect x="17" y="17" width="13" height="13" rx="3.5" fill="#E5484D"/>
</svg>

    <text x="106" y="54" font-size="26" font-weight="800" fill="#f0f6fc" letter-spacing="-.02em">cashflow</text>
    <rect x="106" y="66" width="171.4" height="24" rx="12" fill="#00c9a7" fill-opacity=".14"/>
    <circle class="pulse" cx="120" cy="78" r="4" fill="#00c9a7"/><circle cx="120" cy="78" r="4" fill="#00c9a7"/><text x="132" y="82.5" font-size="12.5" font-weight="700" fill="#00c9a7" >Open source · live</text>
    <text x="24" y="126" font-size="16" font-weight="400" fill="#9198a1" >Open-source, local-first finance app with a grounded Claude</text><text x="24" y="148" font-size="16" font-weight="400" fill="#9198a1" >assistant.</text>
