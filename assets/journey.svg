<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t">
  <title id="t">My journey: B.E. at St Joseph's (2015), Cognizant (2019), MS at Southern Arkansas University and Morgan Stanley (2022), NC DHHS (2025), building AI products and open source today</title>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .year { font-size: 15px; font-weight: 800; fill: #00ffc6; }
    .role { font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .org { font-size: 12px; fill: #9ca3af; }
    /* train runs the line in 9s, waits 3s, starts over; each stop pulses as it arrives (1.8s apart) */
    .train { animation: run 12s cubic-bezier(.45,.05,.55,.95) infinite; }
    @keyframes run { 0% { transform: translateX(0); opacity: 0; } 4% { opacity: 1; } 75% { transform: translateX(1000px); opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(1000px); opacity: 0; } }
    .ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pulse 12s ease-out infinite; }
    @keyframes pulse { 0% { opacity: .9; transform: scale(1); } 10% { opacity: 0; transform: scale(2.6); } 100% { opacity: 0; } }
    .smoke { animation: puff 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes puff { from { opacity: .7; transform: translate(0,0) scale(.6); } to { opacity: 0; transform: translate(-10px,-18px) scale(1.4); } }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 2s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .draw { stroke-dashoffset: 0; } .train { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f14"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <linearGradient id="rail" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="1120" y2="0"><stop offset="0" stop-color="#00ffc6"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="40" y="44" font-size="18" font-weight="700" fill="#e6edf3">🚂 My journey</text>

  <!-- track: sleepers + rail drawn in -->
  <line x1="80" y1="150" x2="1120" y2="150" stroke="#30363d" stroke-width="14" stroke-dasharray="3 9"/>
  <line class="draw" x1="80" y1="150" x2="1120" y2="150" stroke="url(#rail)" stroke-width="3" pathLength="1000"/>

  <!-- stops -->
  <g>
    <circle class="ring" cx="100" cy="150" r="10" fill="none" stroke="#00ffc6" stroke-width="2" style="animation-delay:0s"/>
    <circle class="ring" cx="300" cy="150" r="10" fill="none" stroke="#00ffc6" stroke-width="2" style="animation-delay:1.8s"/>
    <circle class="ring" cx="500" cy="150" r="10" fill="none" stroke="#00ffc6" stroke-width="2" style="animation-delay:3.6s"/>
    <circle class="ring" cx="700" cy="150" r="10" fill="none" stroke="#00ffc6" stroke-width="2" style="animation-delay:5.4s"/>
    <circle class="ring" cx="900" cy="150" r="10" fill="none" stroke="#818cf8" stroke-width="2" style="animation-delay:7.2s"/>
    <circle class="ring" cx="1100" cy="150" r="10" fill="none" stroke="#818cf8" stroke-width="2" style="animation-delay:9s"/>
    <g fill="#0b0f14" stroke-width="3">
      <circle cx="100" cy="150" r="9" stroke="#00ffc6"/><circle cx="300" cy="150" r="9" stroke="#00ffc6"/>
      <circle cx="500" cy="150" r="9" stroke="#00ffc6"/><circle cx="700" cy="150" r="9" stroke="#00ffc6"/>
      <circle cx="900" cy="150" r="9" stroke="#818cf8"/><circle cx="1100" cy="150" r="9" stroke="#818cf8" fill="#818cf8"/>
    </g>
  </g>

  <!-- labels: year above, role + place below -->
  <g text-anchor="middle">
    <text class="year" x="100" y="118">2015</text>
    <text class="role" x="100" y="190">B.E. Computer Science</text><text class="org" x="100" y="208">St Joseph's College</text><text class="org" x="100" y="224">of Engineering</text>
    <text class="year" x="300" y="118">2019</text>
    <text class="role" x="300" y="190">Full-Stack Developer</text><text class="org" x="300" y="208">Cognizant</text>
    <text class="year" x="500" y="118">2022</text>
    <text class="role" x="500" y="190">MS Computer Science</text><text class="org" x="500" y="208">Southern Arkansas University</text>
    <text class="year" x="700" y="118">2022</text>
    <text class="role" x="700" y="190">Senior Full-Stack Developer</text><text class="org" x="700" y="208">Morgan Stanley</text>
    <text class="year" x="900" y="118">2025</text>
    <text class="role" x="900" y="190">Senior Full-Stack Developer</text><text class="org" x="900" y="208">NC DHHS</text>
    <text class="year" x="1100" y="118" style="fill:#818cf8">Today</text>
    <text class="role" x="1100" y="190">Still building</text><text class="org" x="1100" y="208">AI products</text><text class="org" x="1100" y="224">&amp; open source</text>
  </g>

  <!-- the train -->
  <g class="train">
    <circle class="smoke" cx="112" cy="128" r="5" fill="#9ca3af"/>
    <rect x="82" y="134" width="36" height="16" rx="5" fill="#00ffc6"/>
    <rect x="104" y="126" width="10" height="10" rx="2" fill="#00ffc6"/>
    <rect x="86" y="138" width="9" height="6" rx="1.5" fill="#0b0f14"/>
    <circle cx="90" cy="152" r="3.5" fill="#e6edf3"/><circle cx="110" cy="152" r="3.5" fill="#e6edf3"/>
  </g>
</svg>
