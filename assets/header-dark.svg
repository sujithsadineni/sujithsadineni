<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t">
  <title id="t">Sujith Kumar Sadineni, Senior Full-Stack Engineer</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono text, text.mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
    .in{opacity:0;transform-box:fill-box;transform-origin:center;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.35s}.d4{animation-delay:.5s}
    /* five roles, 4s each: shared keyframes, negative delays give each its own slot */
    .role { animation: slot 20s linear infinite; }
    @keyframes slot { 0%, 19% { opacity: 1; } 19.01%, 100% { opacity: 0; } }
    .cover { animation: type 20s infinite; }
    @keyframes type { 0% { transform: translateX(0); } 9%, 100% { transform: translateX(var(--w)); } }
    .caret { animation: blink 1.06s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in{animation:fade .2s forwards}@keyframes fade{to{opacity:1}}
      .caret { animation: none; }
      .role { animation: none; opacity: 0; } .role:first-child { opacity: 1; }
      .cover { animation: none; transform: translateX(var(--w)); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f14"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#00c9a7" stop-opacity="0.28"/><stop offset="1" stop-color="#00c9a7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/></pattern>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00c9a7"/><stop offset="1" stop-color="#00c9a7" stop-opacity=".82"/></linearGradient>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <clipPath id="well"><rect x="100" y="238" width="520" height="40"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
