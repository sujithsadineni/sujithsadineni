<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-label="Journey: B.E. Computer Science, St Joseph's College of Engineering (2015 – 2019); Full-Stack Developer, Cognizant (2019 – 2022); MS Computer Science, Southern Arkansas University (2022 – 2024); Senior Full-Stack Developer, Morgan Stanley (2022 – 2025); Senior Full-Stack Developer, NC DHHS (2025 – now); Building AI products, Open source: cashflow, patchpilot.">
  <style>text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif}.in{opacity:0;transform-box:fill-box;transform-origin:center;animation:in .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}.rail{stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 1.6s cubic-bezier(.2,.8,.2,1) .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,.8,.2,1) forwards}@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.breathe{transform-box:fill-box;transform-origin:center;animation:breathe 2.8s ease-in-out 2s infinite}@keyframes breathe{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:0;transform:scale(2.2)}}
@media (prefers-reduced-motion:reduce){.rail{animation:none;stroke-dashoffset:0}.pop{animation:none;opacity:1}.breathe{animation:none;opacity:0}}@media (prefers-reduced-motion:reduce){.in{animation:fade .2s forwards}@keyframes fade{to{opacity:1}}}</style>
