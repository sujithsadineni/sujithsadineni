<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t">
  <title id="t">Sujith Kumar Sadineni, Senior Full-Stack Engineer</title>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .orb { animation: drift 14s ease-in-out infinite alternate; }
    .orb2 { animation-duration: 18s; animation-direction: alternate-reverse; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(120px, 40px); } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    /* five roles, 4s each: shared keyframes, negative delays put each one in its own slot */
    .role { animation: slot 20s linear infinite; }
    @keyframes slot { 0%, 19% { opacity: 1; } 19.01%, 100% { opacity: 0; } }
    .cover { animation: type 20s infinite; animation-delay: inherit; }
    @keyframes type { 0% { transform: translateX(0); animation-timing-function: steps(28, end); } 9%, 100% { transform: translateX(var(--w)); } }
    .caret { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .chip { animation: bob 5s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-8px); } }
    .mark { animation: glow 4s ease-in-out infinite; }
    @keyframes glow { 50% { stroke-opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .rise { opacity: 1; }
      .role { opacity: 0; } .r0 { opacity: 1; }
      .cover { transform: translateX(var(--w)); }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#00ffc6" stop-opacity=".35"/><stop offset="1" stop-color="#00ffc6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#6366f1" stop-opacity=".35"/><stop offset="1" stop-color="#6366f1" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity=".06"/></pattern>
    <linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#a7f3e4"/></linearGradient>
    <clipPath id="panel"><rect x="100" y="236" width="516" height="40"/></clipPath>
    <clipPath id="card"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#dots)"/>
    <circle class="orb" cx="980" cy="60" r="260" fill="url(#g1)"/>
    <circle class="orb orb2" cx="760" cy="300" r="240" fill="url(#g2)"/>
  </g>
  <rect x=".5" y=".5" width="1199" height="319" rx="20" fill="none" stroke="#ffffff" stroke-opacity=".08"/>

  <!-- SS mark, as on the portfolio navbar -->
  <g class="rise">
    <rect class="mark" x="64" y="48" width="48" height="48" rx="12" fill="none" stroke="#00ffc6" stroke-width="2.5"/>
    <text class="sans" x="88" y="79" text-anchor="middle" font-size="18" font-weight="700" fill="#00ffc6">SS</text>
    <text class="sans" x="128" y="79" font-size="16" fill="#9ca3af">github.com/sujithsadineni</text>
  </g>

  <text class="sans rise d1" x="64" y="150" font-size="22" fill="#9ca3af">👋 Hi, I'm</text>
  <text class="sans rise d2" x="64" y="200" font-size="50" font-weight="800" fill="url(#name)">Sujith Kumar Sadineni</text>

  <!-- terminal line with typed roles -->
  <g class="rise d3">
    <rect x="64" y="228" width="560" height="54" rx="12" fill="#161b22" stroke="#30363d"/>
    <text class="mono" x="86" y="262" font-size="20" fill="#00ffc6">$</text>
    <g class="mono" font-size="20" fill="#e6edf3" clip-path="url(#panel)">
      <g class="role r0" style="animation-delay:0s;--w:316px"><text x="110" y="262">Senior Full-Stack Engineer</text>
        <g class="cover"><rect x="108" y="240" width="470" height="32" fill="#161b22"/><rect class="caret" x="108" y="244" width="11" height="24" fill="#00ffc6"/></g></g>
      <g class="role" style="animation-delay:-16s;--w:376px"><text x="110" y="262">Cloud &amp; Microservices Architect</text>
        <g class="cover"><rect x="108" y="240" width="470" height="32" fill="#161b22"/><rect class="caret" x="108" y="244" width="11" height="24" fill="#00ffc6"/></g></g>
      <g class="role" style="animation-delay:-12s;--w:340px"><text x="110" y="262">React, Java &amp; AWS Specialist</text>
        <g class="cover"><rect x="108" y="240" width="470" height="32" fill="#161b22"/><rect class="caret" x="108" y="244" width="11" height="24" fill="#00ffc6"/></g></g>
      <g class="role" style="animation-delay:-8s;--w:316px"><text x="110" y="262">AI-Powered Product Builder</text>
        <g class="cover"><rect x="108" y="240" width="470" height="32" fill="#161b22"/><rect class="caret" x="108" y="244" width="11" height="24" fill="#00ffc6"/></g></g>
      <g class="role" style="animation-delay:-4s;--w:328px"><text x="110" y="262">Open-Source Project Builder</text>
        <g class="cover"><rect x="108" y="240" width="470" height="32" fill="#161b22"/><rect class="caret" x="108" y="244" width="11" height="24" fill="#00ffc6"/></g></g>
    </g>
  </g>

  <!-- floating chips -->
  <g class="sans" font-size="16" font-weight="600" text-anchor="middle">
    <g class="chip" style="animation-delay:0s"><rect x="820" y="70" width="150" height="40" rx="20" fill="#00ffc6" fill-opacity=".12" stroke="#00ffc6" stroke-opacity=".5"/><text x="895" y="96" fill="#00ffc6">7+ years</text></g>
    <g class="chip" style="animation-delay:-1s"><rect x="1000" y="120" width="130" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="1065" y="146" fill="#e6edf3">React</text></g>
    <g class="chip" style="animation-delay:-2s"><rect x="760" y="140" width="130" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="825" y="166" fill="#e6edf3">Java</text></g>
    <g class="chip" style="animation-delay:-3s"><rect x="900" y="200" width="120" height="40" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".15"/><text x="960" y="226" fill="#e6edf3">AWS</text></g>
    <g class="chip" style="animation-delay:-4s"><rect x="1040" y="230" width="130" height="40" rx="20" fill="#6366f1" fill-opacity=".18" stroke="#818cf8" stroke-opacity=".6"/><text x="1105" y="256" fill="#c7d2fe">Claude API</text></g>
  </g>
</svg>
